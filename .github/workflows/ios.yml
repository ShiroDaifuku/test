# iOS 云构建工作流 — v2(native 全绿;unity 模式待首轮联调)
# 目标仓库:ShiroDaifuku/test(public)· 仓库内只放【改造覆盖层 + 构建脚本】,不放素材/发行包
# 模式:
#   native —— 交叉编译 8 个 iOS arm64 静态库(无需 Unity 许可)
#   unity  —— 编译原生库 + 应用覆盖层 + Unity 导出 Xcode 工程 + 免签 xcodebuild
name: ios

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'native | unity'
        required: true
        default: 'native'
      upstream_zip:
        description: '上游源码 zip(默认 GitHub 镜像 main 归档)'
        required: false
        default: 'https://codeload.github.com/SethPDA/MDPro3/zip/refs/heads/main'
      unity_version:
        description: 'Unity 版本(与 ProjectVersion.txt 一致)'
        required: false
        default: '6000.0.28f1'

permissions:
  contents: read

jobs:
  native-libs:
    if: ${{ github.event.inputs.mode == 'native' }}
    runs-on: macos-latest
    steps:
      - name: checkout overlay(本项目)
        uses: actions/checkout@v4
        with:
          path: overlay
      - name: 下载上游基线源码
        run: |
          curl -L -o /tmp/mdpro3.zip "${{ github.event.inputs.upstream_zip }}"
          mkdir -p src && cd src
          unzip -q /tmp/mdpro3.zip
          mv $(ls -d */ | head -1) mdpro3
      - name: 交叉编译 iOS 静态库
        run: |
          bash overlay/ios-overlay/native-ios/build-ios-libs.sh "$(pwd)/src/mdpro3" /tmp/ios-libs
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-libs
          path: /tmp/ios-libs/lib*.a
          if-no-files-found: error

  unity-xcode:
    if: ${{ github.event.inputs.mode == 'unity' }}
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: com.shirodaifuku.mdpro3
      IOS_TARGET_OS: '16.0'
      IOS_OUTPUT: ${{ github.workspace }}/work/project/Build/iOS
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay
      - name: 下载上游基线源码并展开为工程
        run: |
          curl -L -o /tmp/mdpro3.zip "${{ github.event.inputs.upstream_zip }}"
          mkdir -p work && cd work
          unzip -q /tmp/mdpro3.zip
          mv $(ls -d */ | head -1) project
      - name: 编译 iOS 原生库(lua/event/ocgcore/ygoserver 等 8 个 .a)
        run: |
          bash overlay/ios-overlay/native-ios/build-ios-libs.sh "$(pwd)/work/project" /tmp/ios-libs
      - name: 拷入原生库到 Assets/Plugins/iOS/
        run: |
          mkdir -p work/project/Assets/Plugins/iOS
          cp /tmp/ios-libs/lib*.a work/project/Assets/Plugins/iOS/
          ls -la work/project/Assets/Plugins/iOS/
      - name: 应用 iOS 覆盖层(overlay.js:补丁 + 新文件)
        run: |
          node overlay/ios-overlay/overlay.js "$(pwd)/work/project"
      - name: 工程初始化为 git 仓库(unity-builder 内部依赖 git 命令)
        run: |
          cd work/project
          git init -q
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm init
      # 注:GameCI v4 Personal 许可 = UNITY_LICENSE(.ulf 内容) secret,builder 自带激活,无需单独 activator
      - name: 安装 Unity + iOS 模块并导出 Xcode 工程
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ github.event.inputs.unity_version }}
          targetPlatform: iOS
          projectPath: work/project
          buildMethod: MDPro3iOSBuild.Build
          allowDirtyBuild: true
          buildName: Unity-iPhone
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      - name: xcodebuild(免签仅编译验证)
        run: |
          set -e
          ls -la work/project/Build/iOS | head -30
          cd work/project/Build/iOS
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/dd build
      - name: 上传未签名产物(架构验证用)
        uses: actions/upload-artifact@v4
        with:
          name: unity-ios-unsigned
          path: /tmp/dd/Build/Products/Release-iphoneos/Unity-iPhone.app
          if-no-files-found: error
      # TODO(P1 后期):签名步骤 —— 以 base64 Secrets 存 p12/mobileprovision,
      #  创建临时 keychain → codesign → 打包 Payload/*.app → .ipa(参考 LingChat 阶段做法)。

  xcode-build:
    if: ${{ github.event.inputs.mode == 'xcode' }}
    runs-on: macos-latest
    env:
      CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
      PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: 分片下载 Xcode 工程 tar 并拼接解包
        run: |
          set -e
          mkdir -p work && cd work
          ok=0
          for i in $(seq 1 9); do
            if curl -fL -sS -o "part.$i" "https://github.com/ShiroDaifuku/test/releases/download/xcode-proj/mdpro3-xcode.tar.part$i"; then
              echo "part$i ok ($(du -h part.$i | cut -f1))"; ok=$i
            else
              echo "part$i missing; stop"; break
            fi
          done
          [ "$ok" -ge 1 ] || { echo "no parts"; exit 1; }
          cat part.1 part.2 part.3 part.4 part.5 part.6 part.7 part.8 part.9 > xcode.tar 2>/dev/null || true
          # 防止空 part 文件混入;只拼接存在的
          : > xcode.tar
          for i in $(seq 1 9); do [ -s "part.$i" ] && cat "part.$i" >> xcode.tar; done
          tar -xf xcode.tar
          ls -d iOS && du -sh iOS
      - name: 安装签名证书与描述文件
        run: |
          set -u
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASS="ios-build"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          if security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security -A 2>/tmp/import_direct.log; then
            echo "p12 direct import ok"
          else
            OPENSSL3=""
            for c in "/opt/homebrew/opt/openssl@3/bin/openssl" "/usr/local/opt/openssl@3/bin/openssl"; do
              [ -x "$c" ] && OPENSSL3="$c" && break
            done
            if [ -z "$OPENSSL3" ]; then brew install openssl@3 >/dev/null 2>&1 || true; fi
            for c in "/opt/homebrew/opt/openssl@3/bin/openssl" "/usr/local/opt/openssl@3/bin/openssl"; do
              [ -x "$c" ] && OPENSSL3="$c" && break
            done
            "$OPENSSL3" pkcs12 -in /tmp/cert.p12 -passin pass:"$CERTIFICATE_PASSWORD" -nodes -legacy -out /tmp/cert.pem 2>/dev/null \
              || "$OPENSSL3" pkcs12 -in /tmp/cert.p12 -passin pass:"$CERTIFICATE_PASSWORD" -nodes -out /tmp/cert.pem
            security import /tmp/cert.pem -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -A
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN" 2>/dev/null || true)"
          echo "$IDENTITIES"
          if ! echo "$IDENTITIES" | grep -q "iPhone Distribution"; then
            echo "::error::未找到 iPhone Distribution 身份"; exit 1
          fi
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" > /tmp/profile.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist 2>/dev/null || true
      - name: 免签编译 Release App
        run: |
          set -e
          cd work/iOS
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/dd build
      - name: 手动 codesign(UnityFramework + App)并打包 ipa
        run: |
          set -e
          APP_DIR="/tmp/dd/Build/Products/Release-iphoneos"
          APP="$(ls -d "$APP_DIR"/*.app | head -1)"
          echo "APP=$APP"
          # 1) 放入描述文件
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" "$APP/embedded.mobileprovision"
          # 2) 提取签名身份完整名
          IDENT="$(security find-identity -v -p codesigning | grep 'iPhone Distribution' | sed -E 's/.*"([^"]+)".*/\1/' | head -1)"
          echo "IDENT=$IDENT"
          # 3) 从描述文件提取 entitlements
          security cms -D -i "$APP/embedded.mobileprovision" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist
          # 4) 先签内嵌 framework(如有)
          if [ -d "$APP/Frameworks/UnityFramework.framework" ]; then
            codesign --force --sign "$IDENT" --timestamp=none "$APP/Frameworks/UnityFramework.framework"
          fi
          # 5) 签 App
          codesign --force --sign "$IDENT" --entitlements /tmp/entitlements.plist --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          # 6) 组装 ipa
          mkdir -p /tmp/export/Payload
          cp -R "$APP" /tmp/export/Payload/
          cd /tmp/export
          zip -qry /tmp/export/MDPro3.ipa Payload
          ls -la /tmp/export
      - name: 分片 IPA 便于回传
        run: |
          set -e
          mkdir -p /tmp/ipaparts
          split -b 1800m /tmp/export/MDPro3.ipa /tmp/ipaparts/mdpro3-ipa.part
          ls -la /tmp/ipaparts
      - name: 上传签名 IPA 分片
        uses: actions/upload-artifact@v4
        with:
          name: mdpro3-ipa-parts
          path: /tmp/ipaparts/
          if-no-files-found: error
          retention-days: 3

  finish:
    if: always()
    runs-on: ubuntu-latest
    needs: [native-libs, unity-xcode, xcode-build]
    steps:
      - name: 汇总(各 job 自带 if,按 mode 只跑其一)
        run: echo "done mode=${{ github.event.inputs.mode }}"
