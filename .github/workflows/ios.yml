# iOS 云构建工作流 — 草稿 v1(待首轮联调细化)
# 目标仓库:ShiroDaifuku/test(public)· 仓库内只放【改造覆盖层 + 构建脚本】,不放素材/发行包
# 运行方式:workflow_dispatch(本地 build-ios.cjs 触发)
# 两个模式:
#   native —— 交叉编译 ocgcore/ygoserver/sqlite3 → iOS arm64 静态库(.a)
#              ★ 不需要 Unity 许可,账号注册期间即可先跑通
#   unity  —— 安装 Unity 6000.0.28f1 + iOS 模块,导出 Xcode 工程,xcodebuild + 签名出 ipa
#              ★ 需要 Secrets:UNITY_EMAIL/UNITY_PASSWORD(+可选 UNITY_SERIAL)
# 基线:构建时在 runner 上从上游公开地址拉取源码(固定 commit),再叠本项目覆盖层,
#       从而 ShiroDaifuku/test 保持"纯自有内容"(合规考量,勿把上游/素材入库)。
name: ios

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'native(原生库,iOS .a) | unity(Xcode工程+签名ipa)'
        required: true
        default: 'native'
      upstream_zip:
        description: '上游源码 zip(默认 GitHub 镜像 main 归档)'
        required: false
        default: 'https://codeload.github.com/SethPDA/MDPro3/zip/refs/heads/main'
      unity_version:
        description: 'Unity 版本(与 ProjectVersion.txt 一致)'
        required: false
        default: '6000.0.28f1'

permissions:
  contents: read

jobs:
  native-libs:
    if: ${{ github.event.inputs.mode == 'native' }}
    runs-on: macos-latest
    steps:
      - name: checkout overlay(本项目)
        uses: actions/checkout@v4
        with:
          path: overlay
      - name: 下载上游基线源码
        run: |
          curl -L -o /tmp/mdpro3.zip "${{ github.event.inputs.upstream_zip }}"
          mkdir -p src && cd src
          unzip -q /tmp/mdpro3.zip
          mv $(ls -d */ | head -1) mdpro3
      - name: 输出 C++ 构建树信息(首轮调试用)
        run: |
          find src/mdpro3/'Tools/YGO Classes' -maxdepth 2 -type f | head -80
          echo "---- build/android ----"
          ls -laR src/mdpro3/'Tools/YGO Classes'/build/android 2>/dev/null | head -60
          echo "---- build/windows ----"
          ls -laR src/mdpro3/'Tools/YGO Classes'/build/windows 2>/dev/null | head -60
      # TODO(P2 正文):依据上述 android 配方(CMake/ndk-build?)为 iOS 增加工具链配置,
      # 产出 ocgcore/libocgcore.a、ygoserver/libygoserver.a(sqlite3 可用 Apple 系统库 -lsqlite3 替代)。
      # 参考:社区 YGOMobile-cn-ko-en 已有 ocgcore iOS 交叉编译配方。
      - name: 交叉编译 iOS 静态库(占位,待配方)
        run: |
          echo "native cross-compile recipe to be filled after android/windows build scripts reviewed"
          # 期望产物:/tmp/ios-libs/{libocgcore.a,libygoserver.a}(arm64)
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-libs
          path: /tmp/ios-libs/
          if-no-files-found: warn

  unity-xcode:
    if: ${{ github.event.inputs.mode == 'unity' }}
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay
      - name: 下载上游基线源码并展开为工程
        run: |
          curl -L -o /tmp/mdpro3.zip "${{ github.event.inputs.upstream_zip }}"
          mkdir -p work && cd work
          unzip -q /tmp/mdpro3.zip
          mv $(ls -d */ | head -1) project
      - name: 叠加本仓库 iOS 覆盖层(代码补丁/Editor 脚本/额外文件)
        run: |
          rsync -a --ignore-existing overlay/ios-overlay/ work/project/ || true
          # TODO: 若补丁以 git apply 形式维护,改为:
          # cd work/project && git apply /overlay/patches/*.patch
      - name: 激活 Unity Personal 许可(game-ci)
        uses: game-ci/unity-license-activator@v3
        with:
          unityVersion: ${{ github.event.inputs.unity_version }}
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # 若 Personal 激活需要,再加 UNITY_SERIAL
      - name: 安装 Unity + iOS 模块并导出 Xcode 工程
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ github.event.inputs.unity_version }}
          targetPlatform: iOS
          projectPath: work/project
          buildMethod: MDPro3iOSBuild.Build
          allowDirtyBuild: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      # unity-builder 输出在 work/project/Build/iOS(由 MDPro3iOSBuild 指定)
      - name: xcodebuild(免签仅编译验证)
        run: |
          set -e
          cd work/project/Build/iOS
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath /tmp/dd build
      - name: 上传未签名产物(架构验证用)
        uses: actions/upload-artifact@v4
        with:
          name: unity-ios-unsigned
          path: /tmp/dd/Build/Products/Release-iphoneos/Unity-iPhone.app
          if-no-files-found: error
      # TODO(P1 后期):签名步骤 —— 以 base64 Secrets 存 p12/mobileprovision,
      #  创建临时 keychain → codesign → 打包 Payload/*.app → .ipa(参考 LingChat 阶段做法)。

  finish:
    if: always()
    runs-on: ubuntu-latest
    needs: [native-libs, unity-xcode]
    steps:
      - name: 汇总(各 job 自带 if,按 mode 只跑其一)
        run: echo "done mode=${{ github.event.inputs.mode }}"
